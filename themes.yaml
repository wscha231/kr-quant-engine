# themes.yaml — 한국시장 테마 분류 + phase classifier
# r1000 themes.yaml 패턴 차용. P2에서 본격 활용.

version: "0.1"
last_updated: "2026-04-27"

# Phase classifier thresholds
phase_thresholds:
  dormant: { return_3m_max: 0.0 }
  emerging: { return_3m_min: 0.0, return_3m_max: 0.15, volume_zscore_min: 1.0 }
  trending: { return_3m_min: 0.15, return_3m_max: 0.50, foreign_inst_net_buy: true }
  parabolic: { return_3m_min: 0.50 }                  # AVOID
  rolling_over: { peak_drop_pct: -0.15, peak_within_months: 3 }   # AVOID

# === 핵심 테마 (P2 시점 확장 예정) ===

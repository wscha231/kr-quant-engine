# themes.yaml — 한국시장 테마 분류 + phase classifier
# r1000 themes.yaml 패턴 차용 + Phase G theme rotation strategy.

version: "0.2"
last_updated: "2026-05-06"

# Phase classifier thresholds (Phase G — Wyckoff lifecycle stages)
# accumulate (축적) -> markup (상승초입) -> distribute (분배) -> markdown (약화)
phase_thresholds:
  dormant: { return_3m_max: 0.0 }
  emerging: { return_3m_min: 0.0, return_3m_max: 0.15, volume_zscore_min: 1.0 }
  trending: { return_3m_min: 0.15, return_3m_max: 0.50, foreign_inst_net_buy: true }
  parabolic: { return_3m_min: 0.50 }                  # AVOID
  rolling_over: { peak_drop_pct: -0.15, peak_within_months: 3 }   # AVOID

# Lifecycle stage classifier thresholds (Wyckoff)
lifecycle_thresholds:
  markup_entry:
    rs_kospi_20d_min: 0.05         # +5% RS over 20d
    abs_return_20d_min: 0.0
    new_high_count_pct_min: 0.30   # 30%+ leaders at 52w high
  distribute_entry:
    rs_kospi_60d_max: -0.02         # RS turning negative
    abs_return_60d_max: 0.0
    vol_z_60d_min: 0.5              # high churn volume
  markdown_entry:
    rs_kospi_60d_max: -0.05
    abs_return_120d_max: 0.0
    breadth_max: 0.30               # < 30% leaders rising
  emergency_exit:
    rs_kospi_20d_zscore_max: -2.0   # RS z-score < -2 = panic exit


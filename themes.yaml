# === Phase 4 등가 — regime별 테마 가중 (P3 정의) ===
regime_theme_multipliers:
  bull_trending:
    semiconductor: 1.20
    ai_software: 1.30
    battery: 1.10
  bear_falling:
    defense: 1.20
    nuclear: 1.15
    bio: 1.05    # defensive
  recovery:
    automotive: 1.20
    semiconductor: 1.15


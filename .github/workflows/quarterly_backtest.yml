name: Quarterly Backtest

on:
  schedule:
    - cron: '0 21 1 1,4,7,10 *'  # 1st of Jan/Apr/Jul/Oct, 06:00 KST
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
      KR_DATA_DIR: ${{ github.workspace }}/data
      RCLONE_CFG_TEXT: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup rclone
        if: ${{ env.RCLONE_CFG_TEXT != '' }}
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CFG_TEXT" > ~/.config/rclone/rclone.conf
          rclone --config ~/.config/rclone/rclone.conf listremotes

      - name: Sync caches from GDrive
        if: ${{ env.RCLONE_CFG_TEXT != '' }}
        run: |
          # Skip cache_pykrx (798 MiB) — see monthly_picks.yml for rationale.
          mkdir -p data/cache_dart data/cache_macro data/cache_misc data/feature_store data/models data/data_pit data/outputs
          rclone copy gdrive:kr_quant_engine/data_pit data/data_pit -P || true
          rclone copy gdrive:kr_quant_engine/cache_misc data/cache_misc -P || true
          rclone copy gdrive:kr_quant_engine/cache_macro data/cache_macro -P || true
          rclone copy gdrive:kr_quant_engine/cache_dart data/cache_dart -P || true
          rclone copy gdrive:kr_quant_engine/feature_store data/feature_store -P || true
          rclone copy gdrive:kr_quant_engine/models data/models -P || true

      - name: Setup KR1000 data store
        run: python tools/setup_kr1000_data_store.py

      - name: Build purged P_MB OOS picks
        run: |
          python tools/build_pmb_oos_picks.py \
            --out data/outputs/p_mb_oos_picks_purged_3sleeve_latest.csv \
            --coverage-json data/outputs/p_mb_oos_picks_purged_3sleeve_latest.coverage.json

      - name: Run quarterly backtest
        run: python tools/run_quarterly_backtest.py --picks data/outputs/p_mb_oos_picks_purged_3sleeve_latest.csv --top-n 20 --weighting equal

      - name: Run KR1000 validation diagnostic
        run: |
          set +e
          python tools/run_kr1000_validation_gate.py \
            --periods official_8y,full_2016,stress_2020_2022,stress_2023_current \
            --profiles full \
            --pmb-oos-picks data/outputs/p_mb_oos_picks_purged_3sleeve_latest.csv \
            --skip-daily-check \
            --allow-blocked-backtest
          rc=$?
          # Keep the legacy quarterly report available even if the KR1000
          # diagnostic is blocked by stale feature_store or price coverage.
          if [ "$rc" != "0" ]; then
            echo "::warning::KR1000 validation diagnostic exited with status $rc"
          fi

      - name: Sync outputs back to GDrive
        if: ${{ env.RCLONE_CFG_TEXT != '' }}
        run: |
          rclone copy data/outputs gdrive:kr_quant_engine/outputs -P || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-backtest-${{ github.run_number }}
          path: |
            data/outputs/quarterly_backtest_*.json
            data/outputs/quarterly_backtest_*_monthly.csv
            data/outputs/p_mb_oos_picks_purged_3sleeve*.csv
            data/outputs/p_mb_oos_picks_purged_3sleeve*.json
            data/outputs/kr1000_validation_gate_*/**
          retention-days: 365

      - name: Slack notify
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":bar_chart: kr-quant-engine quarterly backtest run #${{ github.run_number }} complete.\"}" \
            "$SLACK_WEBHOOK_URL"

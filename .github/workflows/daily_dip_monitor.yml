name: Daily Dip Monitor

# Runs after KRX market close to scan held picks for dip events and apply
# the rule-based shake-out vs distribution classifier
# (Phase F Section 9, research/09_shakeout_vs_distribution/research.md).

on:
  schedule:
    - cron: '30 7 * * 1-5'    # weekdays 16:30 KST (KRX closes 15:30 + 1h margin)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KR_DATA_DIR: ${{ github.workspace }}/data
      RCLONE_CFG_TEXT: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup rclone
        if: ${{ env.RCLONE_CFG_TEXT != '' }}
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CFG_TEXT" > ~/.config/rclone/rclone.conf
          rclone --config ~/.config/rclone/rclone.conf listremotes

      - name: Sync portfolio + cache from GDrive
        if: ${{ env.RCLONE_CFG_TEXT != '' }}
        run: |
          mkdir -p data/cache_pykrx data/cache_misc data/data_pit data/outputs
          rclone copy gdrive:kr_quant_engine/outputs data/outputs -P || true
          rclone copy gdrive:kr_quant_engine/data_pit data/data_pit -P || true
          rclone copy gdrive:kr_quant_engine/cache_misc data/cache_misc -P || true

      - name: Run dip monitor
        id: dip
        run: |
          set +e
          python tools/dip_monitor_simple.py
          rc=$?
          echo "exitcode=$rc" >> "$GITHUB_OUTPUT"
          echo "Monitor exit code: $rc"
          # 0 = no dip events, 2 = HIGH-severity distribution alerts
          if [ $rc -eq 0 ] || [ $rc -eq 2 ]; then exit 0; fi
          exit $rc

      - name: Sync alerts back to GDrive
        if: ${{ env.RCLONE_CFG_TEXT != '' && always() }}
        run: |
          rclone copy data/outputs gdrive:kr_quant_engine/outputs -P || true

      - name: Slack notify (HIGH severity)
        if: ${{ steps.dip.outputs.exitcode == '2' && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          ALERT_JSON="data/outputs/dip_monitor_${STAMP}.json"
          if [ -f "$ALERT_JSON" ]; then
            N_DIST=$(python -c "import json;d=json.load(open('$ALERT_JSON'));print(d.get('n_distribution_alerts',0))")
            N_SHAKE=$(python -c "import json;d=json.load(open('$ALERT_JSON'));print(d.get('n_shakeout_alerts',0))")
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\":warning: kr-quant-engine dip monitor: ${N_DIST} distribution + ${N_SHAKE} shake-out alerts on held picks. Run #${{ github.run_number }}.\"}" \
              "$SLACK_WEBHOOK_URL"
          fi

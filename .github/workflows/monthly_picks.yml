name: Monthly Picks

on:
  schedule:
    - cron: '0 19 1 * *'   # 1st of month, 04:00 KST (UTC+9)
  workflow_dispatch:        # manual trigger via GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
      KR_DATA_DIR: ${{ github.workspace }}/data
      RCLONE_CFG_TEXT: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup rclone
        if: ${{ env.RCLONE_CFG_TEXT != '' }}
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CFG_TEXT" > ~/.config/rclone/rclone.conf
          rclone --config ~/.config/rclone/rclone.conf listremotes

      - name: Sync caches from GDrive
        if: ${{ env.RCLONE_CFG_TEXT != '' }}
        run: |
          # Skip cache_pykrx (798 MiB) — fetch_listing_at_date now uses
          # data_pit/historical_mcap.parquet (1.8 MiB) as the primary PIT
          # source. Bring only the small artifacts the runner actually needs.
          mkdir -p data/cache_dart data/cache_macro data/cache_misc data/feature_store data/models data/data_pit data/outputs
          rclone copy gdrive:kr_quant_engine/data_pit data/data_pit -P || true
          rclone copy gdrive:kr_quant_engine/cache_misc data/cache_misc -P || true
          rclone copy gdrive:kr_quant_engine/cache_macro data/cache_macro -P || true
          rclone copy gdrive:kr_quant_engine/cache_dart data/cache_dart -P || true
          rclone copy gdrive:kr_quant_engine/feature_store data/feature_store -P || true
          rclone copy gdrive:kr_quant_engine/models data/models -P || true

      - name: Build PIT universe history (idempotent)
        run: python tools/build_pit_universe_history.py

      - name: Generate monthly picks
        run: python tools/generate_monthly_picks.py --top-n 20

      - name: Sync outputs + cache back to GDrive (preserve partial work)
        if: ${{ env.RCLONE_CFG_TEXT != '' && always() }}
        run: |
          # Run on success AND failure so partial caches (like newly-computed
          # avg_value_60d_*.parquet) survive workflow crashes for the next run.
          rclone copy data/outputs gdrive:kr_quant_engine/outputs -P || true
          rclone copy data/cache_misc gdrive:kr_quant_engine/cache_misc -P || true
          rclone copy data/cache_macro gdrive:kr_quant_engine/cache_macro -P || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: live-picks-${{ github.run_number }}
          path: |
            data/outputs/live_portfolio_*.csv
            data/outputs/live_meta_*.json
          retention-days: 90

      - name: Slack notify
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":dart: kr-quant-engine monthly picks generated for $(date -u +%Y-%m). See artifacts run #${{ github.run_number }}.\"}" \
            "$SLACK_WEBHOOK_URL"

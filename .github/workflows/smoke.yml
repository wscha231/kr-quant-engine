name: smoke

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Quick smoke + label-deconfliction
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Quick mode runs without pandas/numpy (pure ast + file scans), so the
      # baseline always works. Install lightweight deps so the deconfliction
      # tests (which need pandas) can also run.
      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # pandas is the only hard dependency the new tests need
          pip install "pandas>=2.0" "numpy>=1.24"

      - name: Quick smoke (syntax + structural)
        run: python tests/smoke_test.py --quick

      - name: Multibagger classifier — label deconfliction tests
        run: python tests/test_multibagger_classifier.py

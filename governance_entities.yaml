# governance_entities.yaml — Korean chaebol & governance-watch registry
#
# Phase C2 — used by kr_governance.add_governance_signals to flag
# tickers whose controlling shareholder structure increases governance
# risk. Initial registry covers 15 major groups; expand via:
#
# 1) Add a `groups: <key>:` block with required fields:
#    - listed_tickers: 6-digit ticker list (KOSPI/KOSDAQ)
#    - controlling_family: list of identifying owner names (optional)
#    - private_affiliates: list of unlisted subsidiaries (for related-party
#      detection — placeholder until P_C2_b wired)
#    - watch_keywords: list of keywords to trigger DART monitoring
#    - risk_override: optional structured fields:
#         base_governance_risk: float in [0, 1] (prior, blended into score)
#
# 2) Reload via `from kr_governance import load_governance_entities;
#                load_governance_entities()`
#
# Sources:
#   - 대규모 기업집단 지정 (KFTC, 2024)
#   - 기업집단 포털 (KFTC opc.go.kr)
#
# This list is intentionally conservative — only confirmed major
# chaebols / families. Smaller mid-cap controlled groups (with reform-
# driven discount) can be added incrementally.

